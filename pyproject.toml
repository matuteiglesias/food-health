[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "food-health"
version = "0.1.0"
description = "Private-data-aware personal health, training, and nutrition toolkit"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
reports = ["matplotlib>=3.8,<4", "numpy>=1.24", "pandas>=2.0"]
measurements = ["pandas>=2.0", "google-auth>=2.0", "google-api-python-client>=2.0"]
nutrition = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
dev = ["pytest>=7.0", "matplotlib>=3.8,<4", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.scripts]
food-health = "food_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
